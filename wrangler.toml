name = "omimaramadan"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js/index.js"

# Run the Astro build before every `wrangler deploy` (dist/ is gitignored, so
# a fresh checkout — e.g. Cloudflare Workers Builds — has nothing to deploy
# until this runs).
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

[[kv_namespaces]]
binding = "LEADS"
id = "64d7dfca9968457baafbe8cace50eb78"
preview_id = "c4bda00cb15d4185bef06c530e0316cf"
